<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List - Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4 text-primary">Employee Management System</h2>

        <!-- Header Actions: Add Employee & Search -->
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <a th:href="@{/employees/add}" class="btn btn-success">+ Add Employee</a>
                <a th:href="@{/}" class="btn btn-secondary ms-2">Home</a>
            </div>
            <div class="col-md-6">
                <form th:action="@{/employees}" method="get" class="d-flex justify-content-end">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Search by name..." style="max-width: 250px;">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary ms-1" th:if="${keyword != null}">Reset</a>
                </form>
            </div>
        </div>

        <!-- Employee Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}">1</td>
                        <td th:text="${emp.name}">Rahim Ahmed</td>
                        <td th:text="${emp.email}">rahim@gmail.com</td>
                        <td th:text="${emp.department}">IT</td>
                        <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}">50000.00</td>
                        <td>
                            <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-warning btn-sm">Edit</a>
                            <a th:href="@{/employees/delete/{id}(id=${emp.id})}" 
                               class="btn btn-danger btn-sm" 
                               onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="6" class="text-center text-muted py-4">No employees found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
