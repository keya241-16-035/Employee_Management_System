<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id != null} ? 'Edit Employee' : 'Add Employee'">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4 text-primary" th:text="${employee.id != null} ? 'Edit Employee' : 'Add New Employee'">Employee Form</h3>

        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <!-- Hidden ID Field for Edit -->
            <input type="hidden" th:field="*{id}" />

            <!-- Name Field -->
            <div class="mb-3">
                <label for="name" class="form-label font-weight-bold">Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter full name" required />
            </div>

            <!-- Email Field -->
            <div class="mb-3">
                <label for="email" class="form-label font-weight-bold">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter email address" required />
            </div>

            <!-- Department Field -->
            <div class="mb-3">
                <label for="department" class="form-label font-weight-bold">Department</label>
                <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="Enter department (e.g. IT, HR)" required />
            </div>

            <!-- Salary Field -->
            <div class="mb-3">
                <label for="salary" class="form-label font-weight-bold">Salary</label>
                <input type="number" step="0.01" id="salary" th:field="*{salary}" class="form-control" placeholder="Enter salary" required />
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between">
                <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-success">Save Employee</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
